; ─────────────────────────────────────────────────────────────────────────────────────────────
;  Déploiement de CMS SARIS sur plusieurs postes
;
;  1. Copiez ce fichier, nommez la copie  deploiement.ini  (sans « .exemple »).
;  2. Remplissez les lignes ci-dessous (celles que vous laissez vides ou supprimez seront demandées).
;  3. Posez  deploiement.ini  À CÔTÉ de  « CMS SARIS-Setup-x.y.z.exe »  (clé USB ou dossier partagé).
;  4. Sur chaque poste : double-clic sur l'installateur. L'écran de configuration s'ouvre déjà rempli.
;
;  Ce fichier ne contient JAMAIS d'identifiant ni de mot de passe. Sans « code », la personne qui configure le
;  poste saisit à la première ouverture un code d'appairage (ou, à défaut, son identifiant et son mot de passe).
;  Avec un « code » (voir plus bas), l'écran s'ouvre avec le code déjà saisi : un clic suffit, sans mot de passe.
; ─────────────────────────────────────────────────────────────────────────────────────────────

[deploiement]

; Adresse du serveur central (doit commencer par http:// ou https://)
serveur=https://cms-saris.exemple.org

; Site de rattachement des postes : son CODE (ex. BZV-01) ou son libellé exact. Les sites se gèrent
; dans Référentiels → Sites. S'il n'existe pas sur le serveur, l'écran le signale et demande d'en choisir un.
site=BZV-01

; Nom du poste. {MACHINE} est remplacé par le nom de l'ordinateur : « Accueil {MACHINE} » → « Accueil PC-07 ».
; Sans cette ligne, le poste prend le nom de l'ordinateur.
poste={MACHINE}

; Code d'appairage (facultatif) : créé par un administrateur dans Synchronisation > Appairage. Il remplace l'identifiant
; et le mot de passe. Il expire et ne sert qu'un nombre limité de fois ; l'application l'efface de ce fichier dès que le
; poste est appairé. Retirez le « ; » devant la ligne pour l'utiliser (un code par lot de postes).
;code=K7QM-4XPD
