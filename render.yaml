# ─────────────────────────────────────────────────────────────────────────────
# render.yaml — Mise en ligne CMS SARIS (modèle « ulamu »)
#
#   • cms-saris-api : API NestJS (serveur central)        → service web Node
#   • cms-saris-web : site web React/Vite (PWA, public)   → site statique
#
# La base de données PostgreSQL est hébergée sur NEON (externe à Render) : la
# variable DATABASE_URL doit être renseignée à la main (secret, sync:false).
#
# Le monorepo pnpm réel est dans CMS/APP/CMS-SARIS (rootDir) ; ce fichier vit à la
# racine du dépôt git (lu par Render « New Blueprint »).
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1) API centrale (NestJS) ───────────────────────────────────────────────
  - type: web
    name: cms-saris-api
    runtime: node
    region: frankfurt          # région la plus proche de l'Afrique centrale
    plan: free                 # free = mise en veille après ~15 min d'inactivité.
                               # Pour un central toujours actif → passer en 'starter'.
    rootDir: CMS/APP/CMS-SARIS
    # pnpm via npm (corepack de Node 20.18 a des clés de signature périmées → échec).
    # --prod=false : garde les devDeps (nest CLI, tsc) nécessaires au build même si NODE_ENV=production.
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @cms-saris/db exec prisma generate && pnpm --filter api build
    # Les migrations sont appliquées à chaque déploiement (idempotent) puis l'API démarre.
    #
    # La synchronisation du catalogue de permissions suit, pour la même raison : le
    # catalogue vit dans le CODE (packages/types/src/permissions.ts) mais les gardes
    # d'autorisation lisent la BASE. Sans ce rejeu, toute permission ajoutée au code
    # est déployée sans exister en base — et les rôles perdent silencieusement les
    # accès correspondants (constaté en production le 02/08/2026 : 12 permissions
    # ajoutées côté code, absentes de Neon → référentiels et rapports inaccessibles).
    # Le script est additif et idempotent : il ne supprime jamais rien et ne touche
    # ni aux mots de passe ni aux dérogations individuelles.
    # Volontairement NON bloquant (« ; » et non « && ») : un échec de synchronisation
    # ne doit pas empêcher l'API de démarrer — il est visible dans les logs de déploiement.
    #
    # --experimental-require-module : Node 20.18 refuse require() d'un module ESM
    # (@scure/base via otplib) ; le flag (dispo dès Node 20.17) l'autorise. Même fix que le desktop.
    #
    # ⚠️⚠️ NETTOYAGE PONCTUEL DE NEON — À RETIRER APRÈS CE DÉPLOIEMENT ⚠️⚠️
    #
    # Vide la base de ses données de test (dossiers, visites, consultations, journaux,
    # postes, comptes sauf `admin`) en conservant les référentiels, les rôles et le
    # catalogue de permissions. C'est le SEUL moyen d'agir sur Neon depuis cette chaîne :
    # l'URL de la base est un secret du service, jamais exposée au dépôt.
    #
    # Non bloquant (`|| echo`) : un échec du nettoyage n'empêche pas l'API de démarrer.
    #
    # ⚠️ TANT QUE CETTE ÉTAPE EST PRÉSENTE, elle se rejoue à CHAQUE redémarrage du
    # service (déploiement, plantage, réveil après mise en veille). Toute donnée saisie
    # entre-temps serait donc effacée. LA RETIRER dès le résultat vérifié.
    startCommand: pnpm --filter @cms-saris/db exec prisma migrate deploy && { pnpm --filter @cms-saris/db db:sync-permissions || echo "⚠️  Synchronisation des permissions ÉCHOUÉE — le catalogue en base peut être en retard sur le code."; } && { pnpm --filter @cms-saris/db exec tsx prisma/nettoyer-base.ts --appliquer && pnpm --filter @cms-saris/db exec node prisma/nettoyer-residus.mjs && pnpm --filter @cms-saris/db exec node prisma/controle-base.mjs || echo "⚠️  NETTOYAGE NEON ÉCHOUÉ — voir les lignes ci-dessus."; } && node --experimental-require-module apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # ← coller la chaîne de connexion NEON (secret)
        sync: false
      - key: JWT_SECRET            # ← coller (secret de prod généré)
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: TOTP_ENC_KEY          # ← coller (secret de prod) — NE JAMAIS changer après enrôlement 2FA
        sync: false
      - key: MESSAGE_ENC_KEY       # ← coller (secret de prod) — doit matcher le desktop
        sync: false
      - key: CORS_ORIGINS          # origine(s) du site web public autorisée(s)
        value: https://cms-saris-web.onrender.com
      - key: TRUST_PROXY           # derrière le proxy Render → vraie IP client
        value: "true"

  # ── 2) Site web public (React/Vite, PWA) ───────────────────────────────────
  - type: web
    name: cms-saris-web
    runtime: static
    rootDir: CMS/APP/CMS-SARIS
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile --prod=false && pnpm --filter web build
    staticPublishPath: apps/web/dist
    # SPA : toutes les routes renvoient index.html (routage côté client).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL          # l'URL publique de l'API ci-dessus
        value: https://cms-saris-api.onrender.com
